name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@3259184528f6d99057e8f6e204790cf04b5efc2f # v1.2.1
    with:
      # engines: node >=22, so the 20 the shared default carries would fail install.
      node-versions: '[22, 24]'
      has-build: true
      # Node 22 still ships npm 10, which cannot install vitest 4 at all
      # ("Cannot read properties of null (reading 'edgesOut')"). npm 11 can.
      npm-version: '11'
