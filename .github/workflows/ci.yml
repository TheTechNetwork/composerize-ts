name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    permissions:
      contents: read
    uses: unabandoned/.github/.github/workflows/reusable-ci.yml@bd9eb6bfc5a567b272e0c6f05703a726a2655531 # v1.1.0
    with:
      # engines: node >=22, so the 20 the shared default carries would fail install.
      node-versions: '[22, 24]'
      has-build: true
      # Node 22 still ships npm 10, which cannot install vitest 4 at all
      # ("Cannot read properties of null (reading 'edgesOut')"). npm 11 can.
      npm-version: '11'
