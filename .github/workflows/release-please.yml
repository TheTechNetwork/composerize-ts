on:
  push:
    branches:
      - main
name: release-please
permissions: {}
jobs:
  release-please:
    permissions:
      contents: write # to create release commit (google-github-actions/release-please-action)
      pull-requests: write # to create release PR (google-github-actions/release-please-action)
      id-token: write # OIDC token for npm trusted publishing (no NPM_TOKEN needed)

    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-type: node
          package-name: "@thetechnetwork/composerize-ts"
          bump-minor-pre-major: true

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
        if: ${{ steps.release.outputs.release_created }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - name: Build
        run: pnpm build
        if: ${{ steps.release.outputs.release_created }}

      # npm's trusted publishing (OIDC) requires npm >= 11.5.1; Node 22 ships an
      # older npm. Publishing via npm (not pnpm) so the OIDC exchange configured
      # in the npm registry's Trusted Publisher settings is used - no token.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest
        if: ${{ steps.release.outputs.release_created }}

      - name: Publish to npm (trusted publishing / OIDC)
        run: npm publish --provenance --access public
        if: ${{ steps.release.outputs.release_created }}
