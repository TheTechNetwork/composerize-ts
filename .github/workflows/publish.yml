name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@ba99cd9a9fdc2dc58c550b1793a923e89e6bd4c9 # v1.2.0
    with:
      # `files` ships dist/, which tsc generates; npm publish --ignore-scripts
      # never runs prepublishOnly, so the build has to happen in the workflow.
      build-for-publish: true
    secrets: inherit
