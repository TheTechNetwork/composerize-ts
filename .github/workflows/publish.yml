name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # required for OIDC on the calling job
jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    # Pinned to main until the release carrying `build-for-publish`
    # (unabandoned/.github#37) is cut; repin to that tag once it exists.
    uses: unabandoned/.github/.github/workflows/reusable-publish.yml@main
    with:
      # `files` ships dist/, which tsc generates; npm publish --ignore-scripts
      # never runs prepublishOnly, so the build has to happen in the workflow.
      build-for-publish: true
    secrets: inherit
